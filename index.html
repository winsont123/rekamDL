<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SuaraKasir — Web Recorder (10 SKU)</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f8fafc;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --primary: #1e3a5f;
    --primary-hover: #152b47;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --green: #15803d;
    --green-bg: #dcfce7;
    --green-border: #86efac;
    --amber: #b45309;
    --amber-bg: #fef3c7;
    --blue-bg: #e0f2fe;
    --blue: #0369a1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding-bottom: 92px;
  }
  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .brand h1 {
    font-size: 18px;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .brand span {
    font-size: 12px;
    color: var(--muted);
  }
  select, input[type="text"], input[type="number"] {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    width: 100%;
  }
  .spk-select {
    width: auto;
    min-width: 132px;
    font-weight: 600;
    border-color: #cbd5e1;
  }
  .progress-wrap {
    margin-bottom: 14px;
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-top strong { color: var(--text); }
  .progress-bar {
    height: 8px;
    background: #e2e8f0;
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.25s ease;
  }
  details.meta-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    background: var(--surface);
    margin-bottom: 14px;
  }
  details.meta-box summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
  }
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  .meta-grid label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .meta-full { grid-column: 1 / -1; }
  .consent-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    margin-top: 4px;
  }
  .consent-row input { width: auto; }

  .card {
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    background: #fff;
    margin-bottom: 14px;
  }
  .card.freeform {
    border-color: var(--green-border);
    background: #f0fdf4;
  }
  .card.noisy {
    background: #f8fafc;
  }
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin-bottom: 12px;
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 99px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge-id { background: #e2e8f0; color: #334155; }
  .badge-quiet { background: var(--blue-bg); color: var(--blue); }
  .badge-noisy { background: var(--amber-bg); color: var(--amber); }
  .badge-scripted { background: #f1f5f9; color: #334155; }
  .badge-freeform { background: var(--green-bg); color: var(--green); }
  .badge-done { background: var(--green); color: #fff; margin-left: auto; }

  .prompt-text {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--text);
    margin: 8px 0 10px;
    word-break: break-word;
  }
  .hint-box {
    font-size: 12px;
    color: var(--muted);
    background: rgba(255,255,255,0.75);
    border: 1px dashed #cbd5e1;
    border-radius: 8px;
    padding: 8px 10px;
  }
  .spoken-ref {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  .recorder-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    margin-bottom: 14px;
  }
  .btn-rec {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--primary);
    color: #fff;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .btn-rec:active { transform: scale(0.98); }
  .btn-rec.recording {
    background: var(--danger);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.4); }
    70% { box-shadow: 0 0 0 12px rgba(220,38,38,0); }
    100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    display: inline-block;
  }
  .rec-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    font-size: 13px;
    color: var(--muted);
  }
  .meter-track {
    width: 100%;
    height: 8px;
    background: #e2e8f0;
    border-radius: 99px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    width: 0%;
    background: #16a34a;
    transition: width 0.06s linear;
  }
  .warn-msg {
    width: 100%;
    font-size: 12px;
    color: var(--danger);
    background: var(--danger-soft);
    border: 1px solid #fecaca;
    padding: 8px 10px;
    border-radius: 8px;
    display: none;
  }
  .playback-box {
    width: 100%;
    display: none;
    flex-direction: column;
    gap: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }
  audio {
    width: 100%;
    height: 40px;
  }
  .freeform-input-wrap {
    width: 100%;
    display: none;
    margin-top: 4px;
  }
  .freeform-input-wrap label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--green);
    margin-bottom: 4px;
  }

  .nav-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .btn {
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-next-unrec { background: #f1f5f9; color: var(--primary); }

  .grid-section {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    background: #fff;
  }
  .grid-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
  }
  .grid-header span { font-size: 13px; font-weight: 600; }
  .filter-select { width: auto; font-size: 12px; padding: 5px 8px; }
  .clip-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
  }
  .clip-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 6px 0;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
  }
  .clip-btn.noisy-cell { background: #f1f5f9; }
  .clip-btn.free-cell { border-color: var(--green-border); }
  .clip-btn.done { background: var(--green); color: #fff; border-color: var(--green); }
  .clip-btn.active { outline: 2px solid var(--primary); outline-offset: 1px; }

  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255,255,255,0.96);
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    z-index: 20;
  }
  .bottom-inner {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn-zip {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #0f766e;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-zip:disabled { background: #94a3b8; cursor: not-allowed; }
  .btn-reset {
    padding: 13px 12px;
    border: 1px solid #fecaca;
    background: #fff;
    color: var(--danger);
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <h1>SuaraKasir Recorder</h1>
      <span>Dataset 10 SKU · WAV 16 kHz Mono</span>
    </div>
    <select id="speakerSelect" class="spk-select"></select>
  </header>

  <div class="progress-wrap">
    <div class="progress-top">
      <span id="splitLabel">Split: train</span>
      <span>Terekam: <strong id="progressCount">0 / 100</strong></span>
    </div>
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
  </div>

  <details class="meta-box">
    <summary>Biodata Speaker (isi sekali sebelum mulai)</summary>
    <div class="meta-grid">
      <div><label>Nama (opsional)</label><input id="metaName" type="text" placeholder="Contoh: Budi"></div>
      <div><label>Gender</label>
        <select id="metaGender">
          <option value="">Pilih...</option>
          <option value="L">Laki-laki (L)</option>
          <option value="P">Perempuan (P)</option>
        </select>
      </div>
      <div><label>Usia</label><input id="metaAge" type="text" placeholder="Contoh: 20"></div>
      <div><label>Asal / Logat</label><input id="metaAccent" type="text" placeholder="Contoh: Jakarta / Jawa"></div>
      <div class="meta-full"><label>Tipe HP</label><input id="metaDevice" type="text" placeholder="Contoh: iPhone 13 / Samsung A54"></div>
      <div class="meta-full consent-row">
        <input id="metaConsent" type="checkbox">
        <label for="metaConsent" style="margin:0;color:var(--text);">Saya menyetujui rekaman suara ini digunakan untuk riset akademik SuaraKasir secara anonim.</label>
      </div>
    </div>
  </details>

  <div id="promptCard" class="card">
    <div class="badges">
      <span id="bId" class="badge badge-id">spk01_001</span>
      <span id="bEnv" class="badge badge-quiet">Sesi 1 · Tenang</span>
      <span id="bType" class="badge badge-scripted">Baca Teks</span>
      <span id="bDone" class="badge badge-done" style="display:none;">Sudah Direkam</span>
    </div>
    <div id="promptText" class="prompt-text">Memuat...</div>
    <div id="hintBox" class="hint-box"></div>
    <div id="spokenRef" class="spoken-ref"></div>
  </div>

  <div class="recorder-area">
    <button id="btnRec" class="btn-rec"><span class="dot"></span> <span id="btnRecLabel">Mulai Rekam</span></button>
    <div class="rec-status">
      <span id="recState">Siap merekam (pakai mic HP)</span>
      <strong id="recTimer">00:00.0</strong>
    </div>
    <div class="meter-track"><div id="meterFill" class="meter-fill"></div></div>
    <div id="warnMsg" class="warn-msg"></div>

    <div id="playbackBox" class="playback-box">
      <audio id="audioPlayer" controls playsinline></audio>
      <div id="freeformWrap" class="freeform-input-wrap">
        <label for="freeformInput">Transkrip Gaya Bebas (opsional, huruf kecil & angka ditulis kata):</label>
        <input id="freeformInput" type="text" placeholder="contoh: pak surya dua belas dua bungkus sama aqua tiga botol">
      </div>
    </div>
  </div>

  <div class="nav-row">
    <button id="btnPrev" class="btn">← Sebelumnya</button>
    <button id="btnJumpUnrec" class="btn btn-next-unrec">Ke Belum Rekam</button>
    <button id="btnNext" class="btn btn-primary">Berikutnya →</button>
  </div>

  <div class="grid-section">
    <div class="grid-header">
      <span>Daftar Klip (1–100)</span>
      <select id="gridFilter" class="filter-select">
        <option value="all">Semua (100)</option>
        <option value="unrecorded">Belum direkam</option>
        <option value="quiet">Sesi 1: Tenang (1–60)</option>
        <option value="noisy">Sesi 2: Ramai (61–100)</option>
        <option value="freeform">Gaya Bebas (15)</option>
      </select>
    </div>
    <div id="clipGrid" class="clip-grid"></div>
  </div>
</div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <button id="btnDownloadZip" class="btn-zip" disabled>Download ZIP (0 file)</button>
    <button id="btnResetSpk" class="btn-reset" title="Hapus semua rekaman speaker ini di browser">Reset</button>
  </div>
</div>

const DB_NAME = "SuaraKasirDB_v1";
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("clips")) {
        const s = db.createObjectStore("clips", { keyPath: "clip_id" });
        s.createIndex("speaker_id", "speaker_id", { unique: false });
      }
      if (!db.objectStoreNames.contains("meta")) {
        db.createObjectStore("meta", { keyPath: "speaker_id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function putClip(record) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("clips", "readwrite");
    tx.objectStore("clips").put(record);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getSpeakerClips(speakerId) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("clips", "readonly");
    const idx = tx.objectStore("clips").index("speaker_id");
    const req = idx.getAll(speakerId);
    req.onsuccess = () => {
      const map = {};
      for (const item of req.result) map[item.clip_id] = item;
      resolve(map);
    };
    req.onerror = () => reject(req.error);
  });
}

async function deleteSpeakerClips(speakerId) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("clips", "readwrite");
    const store = tx.objectStore("clips");
    const idx = store.index("speaker_id");
    const req = idx.getAllKeys(speakerId);
    req.onsuccess = () => {
      for (const key of req.result) store.delete(key);
    };
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function saveMeta(metaObj) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("meta", "readwrite");
    tx.objectStore("meta").put(metaObj);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getMeta(speakerId) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("meta", "readonly");
    const req = tx.objectStore("meta").get(speakerId);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function mergeBuffers(chunks) {
  let totalLen = 0;
  for (const c of chunks) totalLen += c.length;
  const result = new Float32Array(totalLen);
  let offset = 0;
  for (const c of chunks) {
    result.set(c, offset);
    offset += c.length;
  }
  return result;
}

function downsampleBuffer(buffer, inputRate, outputRate) {
  if (outputRate === inputRate) return buffer;
  const ratio = inputRate / outputRate;
  const newLen = Math.round(buffer.length / ratio);
  const out = new Float32Array(newLen);
  let offsetResult = 0;
  let offsetBuffer = 0;
  while (offsetResult < out.length) {
    const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
    let accum = 0;
    let count = 0;
    for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
      accum += buffer[i];
      count++;
    }
    out[offsetResult] = count > 0 ? accum / count : 0;
    offsetResult++;
    offsetBuffer = nextOffsetBuffer;
  }
  return out;
}

function encodeWAV(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const writeStr = (offset, str) => {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  };
  writeStr(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);          // PCM
  view.setUint16(22, 1, true);          // Mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);         // 16-bit
  writeStr(36, "data");
  view.setUint32(40, samples.length * 2, true);

  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2) {
    let s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([buffer], { type: "audio/wav" });
}

// ============================================================
// PURE JS ZIP BUILDER (STORE MODE, ZERO EXTERNAL CDN)
// ============================================================
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function buildZip(files) {
  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  for (const f of files) {
    const nameBytes = encoder.encode(f.name);
    const dataBytes = f.data;
    const crc = crc32(dataBytes);
    const size = dataBytes.length;

    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, 0, true);
    lv.setUint16(12, 0x5421, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);
    lv.setUint32(22, size, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);

    localParts.push(local, dataBytes);

    const central = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(central.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0x5421, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    central.set(nameBytes, 46);
    centralParts.push(central);

    offset += local.length + dataBytes.length;
  }

  let cdSize = 0;
  for (const cp of centralParts) cdSize += cp.length;

  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...localParts, ...centralParts, eocd], { type: "application/zip" });
}

const btnResetSpk = document.getElementById("btnResetSpk");

const metaFields = {
  name: document.getElementById("metaName"),
  gender: document.getElementById("metaGender"),
  age: document.getElementById("metaAge"),
  accent: document.getElementById("metaAccent"),
  device: document.getElementById("metaDevice"),
  consent: document.getElementById("metaConsent"),
};

function initSpeakers() {
  const spks = Object.keys(DATASET.speakers);
  speakerSelect.innerHTML = "";
  for (const s of spks) {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = `${s} (${DATASET.speakers[s].split})`;
    speakerSelect.appendChild(opt);
  }
  const saved = localStorage.getItem("suarakasir_last_spk");
  if (saved && DATASET.speakers[saved]) currentSpeaker = saved;
  speakerSelect.value = currentSpeaker;
}

function getClips() {
  return DATASET.speakers[currentSpeaker].clips;
}

async function loadSpeaker(spk) {
  currentSpeaker = spk;
  localStorage.setItem("suarakasir_last_spk", spk);
  recordedMap = await getSpeakerClips(spk);

  const meta = await getMeta(spk);
  metaFields.name.value = meta?.name || "";
  metaFields.gender.value = meta?.gender || "";
  metaFields.age.value = meta?.age || "";
  metaFields.accent.value = meta?.accent || "";
  metaFields.device.value = meta?.device || "";
  metaFields.consent.checked = Boolean(meta?.consent);

  // Langsung lompat ke klip pertama yang belum direkam
  const clips = getClips();
  const firstUnrec = clips.findIndex(c => !recordedMap[c.id]);
  currentIdx = firstUnrec >= 0 ? firstUnrec : 0;
  renderAll();
}

function showWarn(msg) {
  if (!msg) {
    warnMsg.style.display = "none";
    warnMsg.textContent = "";
  } else {
    warnMsg.style.display = "block";
    warnMsg.textContent = msg;
  }
}

function renderAll() {
  const spkObj = DATASET.speakers[currentSpeaker];
  const clips = spkObj.clips;
  const clip = clips[currentIdx];
  const savedRec = recordedMap[clip.id];
  const doneCount = Object.keys(recordedMap).length;

  splitLabel.textContent = `Split: ${spkObj.split.toUpperCase()} · Klip ${currentIdx + 1} dari ${clips.length}`;
  progressCount.textContent = `${doneCount} / ${clips.length}`;
  progressFill.style.width = `${(doneCount / clips.length) * 100}%`;

  btnDownloadZip.disabled = doneCount === 0;
  btnDownloadZip.textContent = `Download ZIP ${currentSpeaker} (${doneCount} klip)`;

  // Card styling
  promptCard.className = "card" + (clip.type === "freeform" ? " freeform" : (clip.env === "noisy" ? " noisy" : ""));
  bId.textContent = clip.id;
  bEnv.textContent = clip.env === "quiet" ? "Sesi 1 · Tempat Tenang" : "Sesi 2 · Tempat Ramai";
  bEnv.className = "badge " + (clip.env === "quiet" ? "badge-quiet" : "badge-noisy");
  bType.textContent = clip.type === "scripted" ? "Baca Teks" : "Gaya Bebas";
  bType.className = "badge " + (clip.type === "scripted" ? "badge-scripted" : "badge-freeform");
  bDone.style.display = savedRec ? "inline-block" : "none";

  promptText.textContent = clip.prompt;
  if (clip.type === "scripted") {
    hintBox.textContent = clip.env === "quiet"
      ? "Baca kalimat di atas apa adanya dengan intonasi normal di ruangan tenang."
      : "Baca kalimat di atas di tempat ramai (dekat kipas angin, jalan, kantin, atau warung).";
    spokenRef.textContent = `Target ucapan: "${clip.text}"`;
  } else {
    hintBox.textContent = "GAYA BEBAS: Ucapkan semua barang, satuan, dan jumlah di atas dengan gaya bicara warung sendiri (bebas tambah 'pak', 'sama', 'terus', 'ya').";
    spokenRef.textContent = "";
  }

  // Audio playback
  showWarn("");
  if (currentAudioUrl) {
    URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl = null;
  }
  if (savedRec) {
    currentAudioUrl = URL.createObjectURL(savedRec.wavBlob);
    audioPlayer.src = currentAudioUrl;
    playbackBox.style.display = "flex";
    recState.textContent = `Tersimpan (${savedRec.duration.toFixed(2)} detik · WAV 16 kHz)`;
    recTimer.textContent = formatTime(savedRec.duration);
    btnRecLabel.textContent = "Rekam Ulang Klip Ini";
    if (clip.type === "freeform") {
      freeformWrap.style.display = "block";
      freeformInput.value = savedRec.transcript || "";
    } else {
      freeformWrap.style.display = "none";
    }
  } else {
    playbackBox.style.display = "none";
    freeformWrap.style.display = "none";
    audioPlayer.removeAttribute("src");
    recState.textContent = "Siap merekam (pakai mic HP)";
    recTimer.textContent = "00:00.0";
    btnRecLabel.textContent = "Mulai Rekam";
  }

  btnPrev.disabled = currentIdx === 0;
  btnNext.disabled = currentIdx === clips.length - 1;

  renderGrid();
}

function renderGrid() {
  const clips = getClips();
  const mode = gridFilter.value;
  clipGrid.innerHTML = "";
  clips.forEach((c, idx) => {
    const isDone = Boolean(recordedMap[c.id]);
    if (mode === "unrecorded" && isDone) return;
    if (mode === "quiet" && c.env !== "quiet") return;
    if (mode === "noisy" && c.env !== "noisy") return;
    if (mode === "freeform" && c.type !== "freeform") return;

    const btn = document.createElement("button");
    btn.className = "clip-btn"
      + (c.env === "noisy" ? " noisy-cell" : "")
      + (c.type === "freeform" ? " free-cell" : "")
      + (isDone ? " done" : "")
      + (idx === currentIdx ? " active" : "");
    btn.textContent = c.no;
    btn.onclick = () => {
      if (isRecording) return;
      currentIdx = idx;
      renderAll();
    };
    clipGrid.appendChild(btn);
  });
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = (sec % 60).toFixed(1).padStart(4, "0");
  return `${String(m).padStart(2, "0")}:${s}`;
}

async function startRecording() {
  showWarn("");
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();
    if (audioCtx.state === "suspended") await audioCtx.resume();

    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: true,
      }
    });

    pcmChunks = [];
    sourceNode = audioCtx.createMediaStreamSource(mediaStream);
    processorNode = audioCtx.createScriptProcessor(4096, 1, 1);
    silentGain = audioCtx.createGain();
    silentGain.gain.value = 0;

    processorNode.onaudioprocess = (e) => {
      if (!isRecording) return;
      const input = e.inputBuffer.getChannelData(0);
      pcmChunks.push(new Float32Array(input));
      let sum = 0;
      for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
      const rms = Math.sqrt(sum / input.length);
      meterFill.style.width = `${Math.min(100, Math.round(rms * 350))}%`;
    };

    sourceNode.connect(processorNode);
    processorNode.connect(silentGain);
    silentGain.connect(audioCtx.destination);

    isRecording = true;
    recordStartTs = performance.now();
    btnRec.classList.add("recording");
    btnRecLabel.textContent = "STOP Rekaman";
    recState.textContent = "Sedang merekam... bicara dengan jelas";

    timerInterval = setInterval(() => {
      const elapsed = (performance.now() - recordStartTs) / 1000;
      recTimer.textContent = formatTime(elapsed);
      if (elapsed >= 29.5) stopRecording();
    }, 100);
  } catch (err) {
    showWarn("Gagal mengakses mikrofon. Pastikan izin mikrofon di browser diaktifkan dan halaman dibuka lewat HTTPS atau localhost.");
  }
}

async function stopRecording() {
  if (!isRecording) return;
  isRecording = false;
  clearInterval(timerInterval);
  meterFill.style.width = "0%";
  btnRec.classList.remove("recording");

  const inputSampleRate = audioCtx ? audioCtx.sampleRate : 48000;
  try {
    if (processorNode) processorNode.disconnect();
    if (sourceNode) sourceNode.disconnect();
    if (silentGain) silentGain.disconnect();
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    if (audioCtx) await audioCtx.close();
  } catch (_) {}

  const merged = mergeBuffers(pcmChunks);
  const resampled = downsampleBuffer(merged, inputSampleRate, TARGET_SR);
  const duration = resampled.length / TARGET_SR;

  if (duration < 1.0) {
    showWarn(`Rekaman terlalu pendek (${duration.toFixed(2)} detik). Minimal 1 detik, silakan rekam ulang.`);
    btnRecLabel.textContent = "Mulai Rekam";
    recState.textContent = "Rekaman dibatalkan (< 1 detik)";
    return;
  }

  const wavBlob = encodeWAV(resampled, TARGET_SR);
  const clip = getClips()[currentIdx];
  const prevTranscript = recordedMap[clip.id]?.transcript || "";

  const recRecord = {
    clip_id: clip.id,
    speaker_id: currentSpeaker,
    wavBlob,
    duration,
    transcript: clip.type === "freeform" ? prevTranscript : clip.text,
    recordedAt: new Date().toISOString(),
  };

  await putClip(recRecord);
  recordedMap[clip.id] = recRecord;
  renderAll();
}

// Event Listeners
btnRec.addEventListener("click", () => {
  if (isRecording) stopRecording();
  else startRecording();
});

speakerSelect.addEventListener("change", (e) => {
  if (isRecording) return;
  loadSpeaker(e.target.value);
});

btnPrev.addEventListener("click", () => {
  if (isRecording || currentIdx === 0) return;
  currentIdx--;
  renderAll();
});

btnNext.addEventListener("click", () => {
  if (isRecording || currentIdx >= getClips().length - 1) return;
  currentIdx++;
  renderAll();
});

btnJumpUnrec.addEventListener("click", () => {
  if (isRecording) return;
  const clips = getClips();
  const nextIdx = clips.findIndex((c, i) => i > currentIdx && !recordedMap[c.id]);
  const anyIdx = nextIdx >= 0 ? nextIdx : clips.findIndex(c => !recordedMap[c.id]);
  if (anyIdx >= 0) {
    currentIdx = anyIdx;
    renderAll();
  } else {
    alert(`Semua ${clips.length} klip untuk ${currentSpeaker} sudah selesai direkam!`);
  }
});

gridFilter.addEventListener("change", renderGrid);

freeformInput.addEventListener("input", async () => {
  const clip = getClips()[currentIdx];
  const saved = recordedMap[clip.id];
  if (!saved) return;
  saved.transcript = freeformInput.value.trim().toLowerCase();
  await putClip(saved);
});

Object.values(metaFields).forEach(el => {
  el.addEventListener("change", async () => {
    await saveMeta({
      speaker_id: currentSpeaker,
      split: DATASET.speakers[currentSpeaker].split,
      name: metaFields.name.value.trim(),
      gender: metaFields.gender.value,
      age: metaFields.age.value.trim(),
      accent: metaFields.accent.value.trim(),
      device: metaFields.device.value.trim(),
      consent: metaFields.consent.checked,
      updatedAt: new Date().toISOString(),
    });
  });
});

btnDownloadZip.addEventListener("click", async () => {
  const clips = getClips();
  const doneClips = clips.filter(c => recordedMap[c.id]);
  if (doneClips.length === 0) return;

  btnDownloadZip.disabled = true;
  btnDownloadZip.textContent = "Menyiapkan ZIP...";

  try {
    const zipEntries = [];
    const csvRows = [
      "clip_id,file,speaker_id,split,session,environment,type,script_id,prompt,text,label,duration_s,recorded_at"
    ];

    const csvEscape = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const spkLower = currentSpeaker.toLowerCase();
    const splitName = DATASET.speakers[currentSpeaker].split;

    for (const c of doneClips) {
      const rec = recordedMap[c.id];
      const relPath = `audio/${spkLower}/${c.id}.wav`;
      const buf = new Uint8Array(await rec.wavBlob.arrayBuffer());
      zipEntries.push({ name: relPath, data: buf });

      const finalText = c.type === "freeform" ? (rec.transcript || "") : c.text;
      csvRows.push([
        c.id, relPath, currentSpeaker, splitName, c.ses, c.env, c.type, c.sid,
        c.prompt, finalText, JSON.stringify(c.label), rec.duration.toFixed(2), rec.recordedAt
      ].map(csvEscape).join(","));
    }

    const enc = new TextEncoder();
    zipEntries.push({
      name: `${spkLower}_manifest.csv`,
      data: enc.encode(csvRows.join("\n")),
    });

    const meta = (await getMeta(currentSpeaker)) || { speaker_id: currentSpeaker, split: splitName };
    zipEntries.push({
      name: `${spkLower}_info.json`,
      data: enc.encode(JSON.stringify(meta, null, 2)),
    });

    const zipBlob = buildZip(zipEntries);
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${currentSpeaker}_SuaraKasir_${doneClips.length}clips.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } finally {
    btnDownloadZip.disabled = false;
    btnDownloadZip.textContent = `Download ZIP ${currentSpeaker} (${doneClips.length} klip)`;
  }
});

btnResetSpk.addEventListener("click", async () => {
  if (!confirm(`Hapus semua rekaman ${currentSpeaker} yang tersimpan di browser ini? Pastikan sudah Download ZIP dulu.`)) return;
  await deleteSpeakerClips(currentSpeaker);
  recordedMap = {};
  currentIdx = 0;
  renderAll();
});

initSpeakers();
loadSpeaker(currentSpeaker);
</script>
</body>
</html>
